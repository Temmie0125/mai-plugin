# mai-plugin 出厂默认配置
# 用户配置请修改 config/config/config.yaml（首次启动自动复制生成）

# ===== 命令 =====
# 命令头词：触发「#mai …」的词，可改为 maimai / maidx 等任意词（修改后需重启生效）
cmdhead: mai

# ===== 基础 =====
# BOT 名称（授权链接等文案中使用；留空则取宿主 bot 昵称）
botName: ''
# 柚子别名服务器 cn 镜像（网络环境不佳时开启）
aliasProxy: false
# 别名推送总开关（SSE/WS 推送新别名到开启的群）
aliasPush: true

# ===== 素材 =====
# 素材内存化：启动时将官方切图预载入内存（加快渲染，占用更多内存）
saveInMemory: true
# 在线素材回退：本地缺失的曲绘/切图（含头像 icon、姓名框 plate）尝试从在线源获取；
# 关闭后渲染不联网，缺图一律用本地默认图
assetsOnline: true
# 静态资源包仓库地址（主人执行 #mai download 时拉取）
# 国内直连 GitHub 不畅时，可直接改填代理前缀地址，例如：
#   https://gh-proxy.com/https://github.com/Temmie0125/mai-plugin-resource-static.git
assetsRepo: 'https://github.com/Temmie0125/mai-plugin-resource-static.git'
# 自动更新资源：插件更新（#mai 更新）成功后，自动检查并更新静态资源包
autoUpdateAssets: true

# ===== 水鱼查分器（Diving-Fish） =====
# 使用代理服务器访问水鱼查分器 API
proberProxy: false
# 水鱼 OAuth 应用（两者都配置后才启用「绑定水鱼」授权）
dfClientId: ''
dfClientSecret: ''
dfAuthUrl: 'https://auth.diving-fish.com'
# OAuth 权限范围：多个权限用空格隔开（面板中为多选）。可选项：
#   profile              读取你的用户名、昵称、头衔
#   email                读取你的账号邮箱及其是否已验证
#   prober.profile.read  读取你在查分器的资料（Rating、姓名框等）
#   prober.records.read  读取你的舞萌 DX 成绩
# 留空或含未知权限名时回退为 prober.records.read
dfScope: 'prober.records.read'

# ===== 落雪查分器（LXNS） =====
# 落雪开发者 Token（使用落雪数据源查分必需）
lxnsDevToken: ''
# 落雪 OAuth 应用（三者都配置后「绑定落雪」才可用授权码流）
lxClientId: ''
lxClientSecret: ''
lxRedirectUri: ''
# 落雪绑定仅限私聊
lxnsBindPrivateOnly: false

# ===== 绑定 =====
# 收到授权码后自动撤回授权消息（水鱼/落雪通用）：
#   撤回 Bot 发出的那条授权链接消息；绑定成功、且 Bot 是该群管理员/群主时，
#   连用户的授权码消息一起撤回（私聊里 Bot 撤不了对方的消息，只能提醒）。
# 关闭后不撤回，但**仍会提醒用户及时撤回**——授权码不该长时间留在聊天里。
# 注：撤回受平台时间窗限制（QQ 自撤回约 2 分钟），超窗口/无权限时同样退回提醒。
autoRecallAuthMsg: true

# ===== 渲染 =====
# 截图 jpeg 质量（0-100）
renderQuality: 100
# 截图超时（毫秒）
renderTimeout: 20000

# ===== 列表 =====
# 列表类页面单页最大行数
helpMaxRows: 60
# 分页大小（多候选选曲、投票列表等）
pageSize: 10

# ===== 猜歌 =====
# 每轮特征提示的间隔（秒）
# ⚠️ 默认 15 而非源的 8：QQ 群消息与官方 QQBot 被动回复均限每分钟 5 条，
#    8 秒间隔会让一局在任一 60 秒窗口内发出 7 条（0/4/12/20/28/36/44/52），必然撞限。
#    15 秒恰好把峰值压到 4 条/分。确有富余可调小，但下限 8 秒。
guessRoundInterval: 15
# 最后一轮之后等待多久揭晓答案（秒；源为 30）
guessRevealTimeout: 30

# ===== 开字母 =====
# 每局抽取的曲目数（默认 8，同 phi-plugin 的 LetterNum）
letterSongCount: 8
# 开字母冷却（秒，0 = 不限；同 phi 的 LetterRevealCd）
letterRevealCd: 0
# 猜题冷却（秒，0 = 不限；同 phi 的 LetterGuessCd）
letterGuessCd: 0
# 随机提示冷却（秒，0 = 不限；同 phi 的 LetterTipCd）
# 用「#mai tips」随机翻开一个字符，受这条约束（与上面的开字母冷却分开计）
letterTipCd: 0
# 多久没有**新的答对**就自动揭晓收尾（秒，默认 300）
# 注意判据是「距上次答对」而非「距开局」——有人答对就重置计时
letterIdleTimeout: 300

# ===== 定时 =====
# 每日自动同步曲库/别名/牌子（改动需重启生效）
# 关闭后仍可随时由主人执行「#mai sync」手动同步
autoSync: true
# 自动同步触发时间（HH:MM，本地时区；一位数亦可，如 5:30；改动需重启生效）
# 默认 05:30 是刻意避开 04:00–04:30 这段宿主与周边插件常见的自动更新/重启窗口。
# 若你在宿主 config/config/bot.yaml 里启用了 update_cron（定时）或 update_time（间隔），
# 请与本值错开——间隔模式的触发时刻不可预测，挑时间躲不掉，本插件已用原子写保证被打断也不留坏缓存。
autoSyncTime: '05:30'
